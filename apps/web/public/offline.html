<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4EBDD" />
    <title>Wordinator needs the internet</title>
    <style>
      :root { color: #2f2925; background: #f4ebdd; font-family: Manrope, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 560px; padding: 32px; background: #fff9ef; border: 2px solid #2f2925; border-radius: 22px; box-shadow: 7px 7px 0 #2f2925; }
      h1 { margin-top: 0; line-height: 1.15; }
      p { line-height: 1.6; }
      button { min-height: 44px; padding: 8px 16px; color: #2f2925; background: #f2ca69; border: 2px solid #2f2925; border-radius: 14px; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to keep learning</h1>
      <p>Wordinator needs an internet connection. Your local drafts remain on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
